version: '3.8'

services:
  # 1. O nosso Banco de Dados
  postgres-db:
    image: postgres:15-alpine
    container_name: oficina-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=oficina
    ports:
      - "25432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - oficina-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oficina"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. A sua API Quarkus
  oficina-api:
    build:
      context: .
      # Apontamos para o Dockerfile oficial que o Quarkus gerou
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: oficina-api
    ports:
      - "8383:8080"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres-db:5432/oficina
    depends_on:
      postgres-db:
        condition: service_healthy # Só sobe a API se o banco estiver 100% pronto
    networks:
      - oficina-network

volumes:
  postgres-data:

networks:
  oficina-network:
    driver: bridge