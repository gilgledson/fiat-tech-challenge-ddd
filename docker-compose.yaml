version: '3.8'

services:
  # 1. O nosso Banco de Dados
  postgres-db:
    image: postgres:15-alpine
    container_name: oficina-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=oficina
    ports:
      - "25432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - oficina-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d oficina" ]
      interval: 5s
      timeout: 5s
      retries: 5
  sonarqube:
    image: sonarqube:latest
    container_name: oficina-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_COMPUTERNAME=oficina-sonarqube
    networks:
      - oficina-network

  # 2. A sua API Quarkus
  # Broker da Saga. Os microsserviços usam a mesma exchange (oficina.events).
  # Painel: http://localhost:15672 (oficina/oficina)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: oficina-rabbitmq
    environment:
      # O usuário padrão "guest" só é aceito a partir de localhost; os
      # serviços conectam de outros containers, então usam este.
      - RABBITMQ_DEFAULT_USER=oficina
      - RABBITMQ_DEFAULT_PASS=oficina
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - oficina-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  oficina-api:
    build:
      context: .
      # Apontamos para o Dockerfile oficial que o Quarkus gerou
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: oficina-api
    ports:
      - "8383:8080"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres-db:5432/oficina
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - QUARKUS_PROFILE=dev
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USERNAME=oficina
      - RABBITMQ_PASSWORD=oficina
    depends_on:
      postgres-db:
        condition: service_healthy # Só sobe a API se o banco estiver 100% pronto
      rabbitmq:
        condition: service_healthy
    networks:
      - oficina-network

volumes:
  postgres-data:

networks:
  oficina-network:
    driver: bridge
