name: CI - Testes e Cobertura

# A pipeline vai rodar sempre que houver um Push na branch main
# ou quando alguém abrir um Pull Request
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    
permissions:
  contents: write
  pull-requests: write
jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    env:
      # No nível do job para poder ser usado no "if" da etapa do SonarCloud
      # (o contexto "secrets" não é aceito em condições).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
    - name: 1. Baixar o código do repositório
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # o SonarCloud precisa do histórico para atribuir as linhas

    - name: 2. Configurar o Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        java-version: '17' 
        distribution: 'temurin'
        cache: maven

    # verify = testes + relatório JaCoCo + falha se a cobertura de linhas
    # ficar abaixo de 80% (regra do JaCoCo no pom.xml).
    - name: 3. Rodar Testes, Gerar Relatório JaCoCo e Exigir 80% de Cobertura
      run: mvn -B clean verify

    # Opcional: só roda se o secret SONAR_TOKEN estiver configurado (junto com
    # as variables SONAR_ORGANIZATION e SONAR_PROJECT_KEY). Sem o token, a
    # análise é feita localmente e o relatório vai como evidência no README.
    - name: 3.5. Análise de Qualidade (SonarCloud)
      if: env.SONAR_TOKEN != ''
      run: |
        mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} \
          -Dsonar.qualitygate.wait=true

    - name: 4. Ler o JaCoCo e Gerar a Medalha (Badge)
      id: jacoco
      uses: cicirello/jacoco-badge-generator@v2
      with:
        generate-branches-badge: false
        jacoco-csv-file: target/site/jacoco/jacoco.csv
        badges-directory: .github/badges

    - name: 5. Salvar a Medalha no Repositório
      if: github.event_name == 'push'
      run: |
        git config --global user.name 'github-actions'
        git config --global user.email 'github-actions@github.com'
        git add .github/badges/jacoco.svg
        git commit -m "chore: Atualizando badge de cobertura de testes [skip ci]" || echo "Nenhuma mudança na cobertura"
        git push

  build-and-deploy:
    needs: test-and-coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: 1. Baixar o código do repositório
      uses: actions/checkout@v4

    - name: 2. Configurar o Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        java-version: '17' 
        distribution: 'temurin'
        cache: maven

    - name: 3. Build da Aplicação (JAR)
      run: |
        chmod +x mvnw
        ./mvnw clean package -DskipTests

    - name: 4. Login no Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 5. Build e Push da Imagem Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        file: src/main/docker/Dockerfile.jvm
        push: true
        tags: gilgledson/oficina-api:latest

    - name: 6. Autenticar no Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: 7. Configurar Contexto do AKS
      uses: azure/aks-set-context@v3
      with:
        resource-group: oficina-resources
        cluster-name: oficina-aks-cluster

    - name: 7.5. Gerar o Secret a partir dos GitHub Secrets
      # kubectl create secret --from-literal (em vez de envsubst sobre YAML):
      # evita quebrar o parser quando algum valor tem caractere especial de
      # YAML (":", "#", aspas etc), que já causou falha de deploy antes.
      env:
        DB_APP_USERNAME: ${{ secrets.DB_APP_USERNAME }}
        DB_APP_PASSWORD: ${{ secrets.DB_APP_PASSWORD }}
        WEBHOOK_APROVACAO_SECRET: ${{ secrets.WEBHOOK_APROVACAO_SECRET }}
        RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
        RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
      run: |
        kubectl create secret generic oficina-db-app \
          --from-literal=username="$DB_APP_USERNAME" \
          --from-literal=password="$DB_APP_PASSWORD" \
          --from-literal=webhook-aprovacao-secret="$WEBHOOK_APROVACAO_SECRET" \
          --from-literal=rabbitmq-username="$RABBITMQ_USERNAME" \
          --from-literal=rabbitmq-password="$RABBITMQ_PASSWORD" \
          --from-literal=new-relic-license-key="$NEW_RELIC_LICENSE_KEY" \
          --dry-run=client -o yaml > k8s/app/secret.yaml

    - name: 8. Deploy do API Gateway (Traefik) no Kubernetes (AKS)
      uses: Azure/k8s-deploy@v5
      with:
        manifests: |
          k8s/gateway/namespace.yaml
          k8s/gateway/rbac.yaml
          k8s/gateway/ingressclass.yaml
          k8s/gateway/deployment.yaml
          k8s/gateway/service.yaml

    # Broker compartilhado pelos três microsserviços. Usa as credenciais do
    # Secret oficina-db-app, aplicado no passo seguinte junto com a aplicação.
    - name: 8.5. Deploy do RabbitMQ (mensageria da Saga) no Kubernetes (AKS)
      run: |
        kubectl apply -f k8s/app/secret.yaml
        kubectl apply -f k8s/messaging/rabbitmq.yaml

    - name: 9. Deploy no Kubernetes (AKS)
      uses: Azure/k8s-deploy@v5
      with:
        manifests: |
          k8s/app/configMap.yaml
          k8s/app/secret.yaml
          k8s/app/deployment.yaml
          k8s/app/service.yaml
          k8s/app/hpa.yaml
          k8s/gateway/ingress.yaml