quarkus:
  swagger-ui:
    always-include: true
  http:
    port: 8080
  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    jdbc:
      url: ${DB_URL_RW}
    ro:
      db-kind: postgresql
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      jdbc:
        url: ${DB_URL_RO}
  fault-tolerance:
    bulkhead:
      max-concurrent-calls: 20
      waiting-task-queue: 40
  hibernate-orm:
    log:
      sql: false
  log:
    category:
      "org.hibernate":
        level: WARN
    console:
      json: true

  # Configurações do Flyway (Migrações)
  flyway:
    migrate-at-start: true
    repair-at-start: true
    baseline-on-migrate: true
    out-of-order: true
    ignore-missing-migrations: true
  # Configuração da extensão de Segurança (SmallRye JWT)
  smallrye-jwt:
    enabled: true

smallrye:
  jwt:
    sign:
      key:
        location: "privateKey.pem"
    verify:
      issuer: "oficina-api-interna"
      key:
        location: "publicKey.pem"

# Secret compartilhado para endpoints de webhook (ex: notificação externa de
# aprovação de orçamento). Trocar via WEBHOOK_APROVACAO_SECRET em qualquer
# ambiente real — o default aqui só serve para desenvolvimento local.
oficina:
  webhook:
    aprovacao-secret: ${WEBHOOK_APROVACAO_SECRET:local-dev-secret-trocar-em-producao}
  outbox:
    # Intervalo de entrega dos eventos pendentes da outbox ao RabbitMQ.
    intervalo: 2s

# Mensageria da Saga (RabbitMQ). A exchange (topic) é compartilhada pelos
# microsserviços; a fila é do OS Service.
mp:
  messaging:
    # Eventos do Billing Service e do Execution Service que a OS consome.
    incoming:
      eventos-externos:
        connector: smallrye-rabbitmq
        exchange:
          name: oficina.events
          type: topic
        queue:
          name: os.eventos
        routing-keys: billing.orcamento-aceito,billing.orcamento-rejeitado,billing.orcamento-falhou,billing.pagamento-confirmado,execucao.diagnostico-iniciado,execucao.diagnostico-concluido,execucao.iniciada,execucao.servico-iniciado,execucao.servico-finalizado,execucao.concluida,execucao.falhou
        # Mensagem que falha vai para a fila os.eventos.dlq.
        failure-strategy: reject
        auto-bind-dlq: true
        # Sem isto o conector não cria a exchange de mensagens mortas e o
        # canal de entrada não sobe.
        dlx:
          declare: true
    # Eventos que o OS Service publica (routing key definida por mensagem).
    outgoing:
      os-events:
        connector: smallrye-rabbitmq
        exchange:
          name: oficina.events
          type: topic
        publish-confirms: true

rabbitmq-host: ${RABBITMQ_HOST:localhost}
rabbitmq-port: ${RABBITMQ_PORT:5672}
rabbitmq-username: ${RABBITMQ_USERNAME:guest}
rabbitmq-password: ${RABBITMQ_PASSWORD:guest}
