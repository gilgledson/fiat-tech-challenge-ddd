# Mesmas rotas dos Ingress de produção (k8s/gateway e os k8s/ingress.yaml do
# Billing e do Execution): o prefixo decide qual microsserviço atende.
server {
    listen 80;
    client_max_body_size 10m;

    # Resolve os nomes a cada requisição, para o gateway subir mesmo que um
    # serviço ainda esteja iniciando.
    resolver 127.0.0.11 valid=5s;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location /api/orcamentos {
        set $billing http://billing-service:8080;
        proxy_pass $billing;
    }

    location ~ ^/api/(execucoes|relatorios|funcionarios) {
        set $execution http://execution-service:8080;
        proxy_pass $execution;
    }

    location / {
        set $os http://os-service:8080;
        proxy_pass $os;
    }
}
