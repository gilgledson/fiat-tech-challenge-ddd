apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      containers:
      - name: oficina-api
        image: docker.io/gilgledson/oficina-api:latest
        imagePullPolicy: Always
        resources:
          # A JVM parada consome por volta de 100m. Com a reserva antiga, de
          # 100m, o HPA via 100% de uso sem nenhuma carga e escalava até o
          # máximo; as JVMs subindo juntas saturavam o nó e as sondas matavam
          # os pods em cascata.
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m" # folga para a subida da JVM, que é o pico de CPU
            memory: "512Mi"
        ports:
        - containerPort: 8080
        # A app pode levar até ~1min pra subir (Flyway rodando todas as
        # migrations + seed em dev). O startupProbe segura o liveness/readiness
        # até a app realmente iniciar, evitando restart em loop por causa de
        # uma inicialização lenta sendo confundida com falha de saúde.
        startupProbe:
          httpGet:
            path: /q/health/started
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60 # até 5 minutos para subir em um nó disputado
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8080
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 4
        envFrom:
        - configMapRef:
            name: oficina-api-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oficina-db-app
              key: password
        - name: WEBHOOK_APROVACAO_SECRET
          valueFrom:
            secretKeyRef:
              name: oficina-db-app
              key: webhook-aprovacao-secret
        - name: RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              name: oficina-db-app
              key: rabbitmq-username
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: oficina-db-app
              key: rabbitmq-password
        - name: NEW_RELIC_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: oficina-db-app
              key: new-relic-license-key