# Não commitar valores reais aqui. Os placeholders ${...} são preenchidos via
# `envsubst` a partir de GitHub Secrets no job build-and-deploy do ci.yml antes
# do apply. Para aplicar manualmente (ex: local/Minikube), renderize primeiro:
#   DB_APP_USERNAME=app_user DB_APP_PASSWORD=... WEBHOOK_APROVACAO_SECRET=... \
#     envsubst < k8s/app/secret.yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: oficina-db-app
type: Opaque
stringData:
  username: ${DB_APP_USERNAME}
  password: ${DB_APP_PASSWORD}
  webhook-aprovacao-secret: ${WEBHOOK_APROVACAO_SECRET}
